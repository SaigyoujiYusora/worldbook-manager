name: apply v4.08

on:
  push:
    branches: [main]
    paths:
      - scripts/v408_patch.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/v408_patch.py
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Test and build
        run: |
          pnpm install
          node --test src/世界书管理器/cache-inspector/pricing.test.cjs
          pnpm build
          rm -rf dist/角色卡示例 dist/脚本示例 dist/流式楼层界面示例 dist/前端界面示例
      - name: Commit
        uses: EndBug/add-and-commit@v9.1.3
        with:
          default_author: github_actions
          message: 'fix: DeepSeek官方人民币计价与版本源 v4.08'
