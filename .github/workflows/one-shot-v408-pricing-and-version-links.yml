name: one-shot v4.08 pricing and version links

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-v408-pricing-and-version-links.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-v408-pricing-and-version-links

jobs:
  apply-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply v4.08 fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(path, from, to) {
            let text = fs.readFileSync(path, 'utf8');
            if (text.includes(to)) {
              console.log(`[skip] ${path}: target already applied`);
              return;
            }
            const count = text.split(from).length - 1;
            if (count !== 1) throw new Error(`${path}: expected exactly one source match, got ${count}`);
            text = text.replace(from, to);
            fs.writeFileSync(path, text);
            console.log(`[ok] ${path}`);
          }

          // 1) Version bump.
          const app = 'src/世界书管理器/App.vue';
          replaceOnce(app, "const APP_VERSION = 'v4.07';", "const APP_VERSION = 'v4.08';");

          // 2) Version manager must use this fork for catalog + all import sources.
          const versionManager = 'src/世界书管理器/version-manager.ts';
          let vm = fs.readFileSync(versionManager, 'utf8');
          const oldRepo = 'jerryzmtz/worldbook-manager';
          const newRepo = 'SaigyoujiYusora/worldbook-manager';
          const hits = vm.split(oldRepo).length - 1;
          if (hits === 0 && !vm.includes(newRepo)) throw new Error(`${versionManager}: old/new repo marker not found`);
          vm = vm.replaceAll(oldRepo, newRepo);
          fs.writeFileSync(versionManager, vm);
          console.log(`[ok] ${versionManager}: replaced ${hits} repo references`);

          // 3) Pricing snapshot exposes the actual CNY/M rate used for billing.
          const types = 'src/世界书管理器/cache-inspector/types.ts';
          replaceOnce(
            types,
            `  outputUsdPerMillion: number;\n  note: string | null;`,
            `  outputUsdPerMillion: number;\n  inputHitCnyPerMillion?: number;\n  inputMissCnyPerMillion?: number;\n  outputCnyPerMillion?: number;\n  note: string | null;`,
          );

          // 4) DeepSeek: use official RMB prices directly instead of USD -> live FX conversion.
          const pricing = 'src/世界书管理器/cache-inspector/pricing.ts';
          replaceOnce(
            pricing,
            `type PricingRateSet = {\n  inputHitUsdPerMillion: number;\n  inputMissUsdPerMillion: number;\n  outputUsdPerMillion: number;\n  note: string | null;\n};`,
            `type PricingRateSet = {\n  inputHitUsdPerMillion: number;\n  inputMissUsdPerMillion: number;\n  outputUsdPerMillion: number;\n  inputHitCnyPerMillion?: number;\n  inputMissCnyPerMillion?: number;\n  outputCnyPerMillion?: number;\n  note: string | null;\n};`,
          );
          replaceOnce(
            pricing,
            `    sourceUrl: 'https://api-docs.deepseek.com/quick_start/pricing/',\n    sourceDate: SOURCE_DATE,\n    matches: model =>\n      includesAny(model, ['deepseek-v4-pro', 'deepseek_v4_pro', 'deepseek v4 pro', 'deepseek-v4-pro-0813']),\n    rates: (_usage, timestamp) => deepSeekTimeOfUseRates(timestamp, {\n      offPeak: [0.022, 0.66, 1.98],\n      peak: [0.044, 1.32, 3.96],\n    }),`,
            `    sourceUrl: 'https://api-docs.deepseek.com/zh-cn/quick_start/pricing/',\n    sourceDate: '2026-10-14',\n    matches: model =>\n      includesAny(model, ['deepseek-v4-pro', 'deepseek_v4_pro', 'deepseek v4 pro', 'deepseek-v4-pro-0813']),\n    rates: (_usage, timestamp) => deepSeekTimeOfUseRates(timestamp, {\n      offPeak: [0.022, 0.66, 1.98],\n      peak: [0.044, 1.32, 3.96],\n      offPeakCny: [0.15, 4.5, 13.5],\n      peakCny: [0.3, 9, 27],\n    }),`,
          );
          replaceOnce(
            pricing,
            `    sourceUrl: 'https://api-docs.deepseek.com/quick_start/pricing/',\n    sourceDate: SOURCE_DATE,\n    matches: model =>\n      includesAny(model, [\n        'deepseek-flash',`,
            `    sourceUrl: 'https://api-docs.deepseek.com/zh-cn/quick_start/pricing/',\n    sourceDate: '2026-10-14',\n    matches: model =>\n      includesAny(model, [\n        'deepseek-flash',`,
          );
          replaceOnce(
            pricing,
            `    rates: (_usage, timestamp) => deepSeekTimeOfUseRates(timestamp, {\n      offPeak: [0.003, 0.15, 0.6],\n      peak: [0.006, 0.3, 1.2],\n    }),`,
            `    rates: (_usage, timestamp) => deepSeekTimeOfUseRates(timestamp, {\n      offPeak: [0.003, 0.15, 0.6],\n      peak: [0.006, 0.3, 1.2],\n      offPeakCny: [0.02, 1, 4],\n      peakCny: [0.04, 2, 8],\n    }),`,
          );
          replaceOnce(
            pricing,
            `  const rates = rule.rates(usage, timestamp);\n  const usdToCnyRate = getUsdToCnyRate();\n  const pricingSnapshot: PricingSnapshot = {`,
            `  const rates = rule.rates(usage, timestamp);\n  const usdToCnyRate = getUsdToCnyRate();\n  const inputHitCnyPerMillion = rates.inputHitCnyPerMillion ?? rates.inputHitUsdPerMillion * usdToCnyRate;\n  const inputMissCnyPerMillion = rates.inputMissCnyPerMillion ?? rates.inputMissUsdPerMillion * usdToCnyRate;\n  const outputCnyPerMillion = rates.outputCnyPerMillion ?? rates.outputUsdPerMillion * usdToCnyRate;\n  const pricingSnapshot: PricingSnapshot = {`,
          );
          replaceOnce(
            pricing,
            `    inputHitUsdPerMillion: rates.inputHitUsdPerMillion,\n    inputMissUsdPerMillion: rates.inputMissUsdPerMillion,\n    outputUsdPerMillion: rates.outputUsdPerMillion,\n    note: rates.note,`,
            `    inputHitUsdPerMillion: rates.inputHitUsdPerMillion,\n    inputMissUsdPerMillion: rates.inputMissUsdPerMillion,\n    outputUsdPerMillion: rates.outputUsdPerMillion,\n    inputHitCnyPerMillion,\n    inputMissCnyPerMillion,\n    outputCnyPerMillion,\n    note: rates.note,`,
          );
          replaceOnce(
            pricing,
            `  const inputHitUsd = priceTokens(usage.hitTokens, rates.inputHitUsdPerMillion);\n  const inputMissUsd = priceTokens(usage.missTokens, rates.inputMissUsdPerMillion);\n  const outputUsd = priceTokens(usage.outputTokens, rates.outputUsdPerMillion);\n  const savedUsd = Math.max(0, priceTokens(usage.hitTokens, rates.inputMissUsdPerMillion - rates.inputHitUsdPerMillion));\n\n  return {\n    pricingSnapshot,\n    costSnapshot: {\n      currency: 'CNY',\n      inputHitCny: usdToCny(inputHitUsd, usdToCnyRate),\n      inputMissCny: usdToCny(inputMissUsd, usdToCnyRate),\n      outputCny: usdToCny(outputUsd, usdToCnyRate),\n      totalCny: usdToCny(inputHitUsd + inputMissUsd + outputUsd, usdToCnyRate),\n      savedCny: usdToCny(savedUsd, usdToCnyRate),\n    },\n  };`,
            `  const inputHitCny = priceTokens(usage.hitTokens, inputHitCnyPerMillion);\n  const inputMissCny = priceTokens(usage.missTokens, inputMissCnyPerMillion);\n  const outputCny = priceTokens(usage.outputTokens, outputCnyPerMillion);\n  const savedCny = Math.max(0, priceTokens(usage.hitTokens, inputMissCnyPerMillion - inputHitCnyPerMillion));\n\n  return {\n    pricingSnapshot,\n    costSnapshot: {\n      currency: 'CNY',\n      inputHitCny,\n      inputMissCny,\n      outputCny,\n      totalCny: inputHitCny + inputMissCny + outputCny,\n      savedCny,\n    },\n  };`,
          );
          replaceOnce(
            pricing,
            `  rateTable: { offPeak: [number, number, number]; peak: [number, number, number] },\n): PricingRateSet {\n  const peak = isDeepSeekPeakTime(timestamp);\n  const [hit, miss, output] = peak ? rateTable.peak : rateTable.offPeak;\n  return {\n    inputHitUsdPerMillion: hit,\n    inputMissUsdPerMillion: miss,\n    outputUsdPerMillion: output,\n    note: peak`,
            `  rateTable: {\n    offPeak: [number, number, number];\n    peak: [number, number, number];\n    offPeakCny: [number, number, number];\n    peakCny: [number, number, number];\n  },\n): PricingRateSet {\n  const peak = isDeepSeekPeakTime(timestamp);\n  const [hit, miss, output] = peak ? rateTable.peak : rateTable.offPeak;\n  const [hitCny, missCny, outputCny] = peak ? rateTable.peakCny : rateTable.offPeakCny;\n  return {\n    inputHitUsdPerMillion: hit,\n    inputMissUsdPerMillion: miss,\n    outputUsdPerMillion: output,\n    inputHitCnyPerMillion: hitCny,\n    inputMissCnyPerMillion: missCny,\n    outputCnyPerMillion: outputCny,\n    note: peak`,
          );
          replaceOnce(
            pricing,
            `      ? 'DeepSeek peak rate: 01:00-04:00 or 06:00-10:00 UTC, Monday-Friday, excluding Chinese public holidays.'\n      : 'DeepSeek off-peak rate: all hours outside the weekday peak windows, including weekends and Chinese public holidays.',`,
            `      ? 'DeepSeek peak rate. Cost uses the official CNY price directly; USD price is reference only.'\n      : 'DeepSeek off-peak rate. Cost uses the official CNY price directly; USD price is reference only.',`,
          );
          // Remove now-unused conversion helper if it is still present.
          let pricingText = fs.readFileSync(pricing, 'utf8');
          pricingText = pricingText.replace(`\nfunction usdToCny(value: number, usdToCnyRate: number): number {\n  return value * usdToCnyRate;\n}\n`, '\n');
          fs.writeFileSync(pricing, pricingText);

          // 5) Old DeepSeek records used the wrong FX-derived CNY snapshots. Recalculate those by timestamp;
          // new records keep their immutable saved snapshot.
          const analytics = 'src/世界书管理器/cache-inspector/analytics.ts';
          replaceOnce(
            analytics,
            `    const cost =\n      record.costSnapshot ?? estimateCacheCost(record.model, record, record.timestamp).costSnapshot;`,
            `    const legacyDeepSeekPricing =\n      record.pricingSnapshot?.provider === 'deepseek' &&\n      !Number.isFinite(record.pricingSnapshot.inputHitCnyPerMillion);\n    const cost =\n      !legacyDeepSeekPricing && record.costSnapshot\n        ? record.costSnapshot\n        : estimateCacheCost(record.model, record, record.timestamp).costSnapshot;`,
          );

          const panel = 'src/世界书管理器/cache-inspector/CacheInspectorPanel.vue';
          replaceOnce(
            panel,
            `    \`命中 ¥\${formatMillionRateCny(pricing.inputHitUsdPerMillion, pricing.usdToCnyRate)}/M\`,\n    \`未命中 ¥\${formatMillionRateCny(pricing.inputMissUsdPerMillion, pricing.usdToCnyRate)}/M\`,\n    \`输出 ¥\${formatMillionRateCny(pricing.outputUsdPerMillion, pricing.usdToCnyRate)}/M\`,`,
            `    \`命中 ¥\${formatPricingRateCny(pricing.inputHitCnyPerMillion, pricing.inputHitUsdPerMillion, pricing.usdToCnyRate)}/M\`,\n    \`未命中 ¥\${formatPricingRateCny(pricing.inputMissCnyPerMillion, pricing.inputMissUsdPerMillion, pricing.usdToCnyRate)}/M\`,\n    \`输出 ¥\${formatPricingRateCny(pricing.outputCnyPerMillion, pricing.outputUsdPerMillion, pricing.usdToCnyRate)}/M\`,`,
          );
          replaceOnce(
            panel,
            `    \`命中 ¥\${formatMillionRateCny(pricingSnapshot.inputHitUsdPerMillion, pricingSnapshot.usdToCnyRate)}/M · 未命中 ¥\${formatMillionRateCny(pricingSnapshot.inputMissUsdPerMillion, pricingSnapshot.usdToCnyRate)}/M · 输出 ¥\${formatMillionRateCny(pricingSnapshot.outputUsdPerMillion, pricingSnapshot.usdToCnyRate)}/M\`,\n    \`费率日期 \${pricingSnapshot.sourceDate} · 1 USD = \${pricingSnapshot.usdToCnyRate.toFixed(4)} RMB\`,`,
            `    \`命中 ¥\${formatPricingRateCny(pricingSnapshot.inputHitCnyPerMillion, pricingSnapshot.inputHitUsdPerMillion, pricingSnapshot.usdToCnyRate)}/M · 未命中 ¥\${formatPricingRateCny(pricingSnapshot.inputMissCnyPerMillion, pricingSnapshot.inputMissUsdPerMillion, pricingSnapshot.usdToCnyRate)}/M · 输出 ¥\${formatPricingRateCny(pricingSnapshot.outputCnyPerMillion, pricingSnapshot.outputUsdPerMillion, pricingSnapshot.usdToCnyRate)}/M\`,\n    pricingSnapshot.provider === 'deepseek'\n      ? \`费率日期 \${pricingSnapshot.sourceDate} · DeepSeek 官方人民币价（不经美元汇率换算）\`\n      : \`费率日期 \${pricingSnapshot.sourceDate} · 1 USD = \${pricingSnapshot.usdToCnyRate.toFixed(4)} RMB\`,`,
          );
          replaceOnce(
            panel,
            `function priceForRecord(record: CacheSummaryRecord): ReturnType<typeof estimateCacheCost> {\n  void exchangeRateVersion.value;\n  if (record.pricingSnapshot && record.costSnapshot) {\n    return { pricingSnapshot: record.pricingSnapshot, costSnapshot: record.costSnapshot };\n  }\n  return estimateCacheCost(record.model, record, record.timestamp);\n}`,
            `function priceForRecord(record: CacheSummaryRecord): ReturnType<typeof estimateCacheCost> {\n  void exchangeRateVersion.value;\n  const legacyDeepSeekPricing =\n    record.pricingSnapshot?.provider === 'deepseek' &&\n    !Number.isFinite(record.pricingSnapshot.inputHitCnyPerMillion);\n  if (!legacyDeepSeekPricing && record.pricingSnapshot && record.costSnapshot) {\n    return { pricingSnapshot: record.pricingSnapshot, costSnapshot: record.costSnapshot };\n  }\n  return estimateCacheCost(record.model, record, record.timestamp);\n}`,
          );
          replaceOnce(
            panel,
            `function formatMillionRateCny(usdPerMillion: number, usdToCnyRate: number): string {\n  return trimTrailingZero((usdPerMillion * usdToCnyRate).toFixed(3));\n}`,
            `function formatPricingRateCny(\n  cnyPerMillion: number | undefined,\n  usdPerMillion: number,\n  usdToCnyRate: number,\n): string {\n  const value = Number.isFinite(cnyPerMillion) ? Number(cnyPerMillion) : usdPerMillion * usdToCnyRate;\n  return trimTrailingZero(value.toFixed(3));\n}`,
          );

          // 6) Tests: direct official RMB rates + total cost.
          const test = 'src/世界书管理器/cache-inspector/pricing.test.cjs';
          replaceOnce(
            test,
            `test('DeepSeek Chinese public holidays are off-peak even on weekdays', () => {`,
            `test('DeepSeek V4 Pro uses official CNY rates directly instead of USD FX conversion', () => {\n  const timestamp = Date.parse('2026-10-09T04:30:00Z'); // 12:30 Beijing, off-peak.\n  const result = estimateCacheCost('deepseek-v4-pro', usage({ hit: 1_000_000, miss: 1_000_000, output: 1_000_000 }), timestamp);\n  assert.equal(result.pricingSnapshot.inputHitCnyPerMillion, 0.15);\n  assert.equal(result.pricingSnapshot.inputMissCnyPerMillion, 4.5);\n  assert.equal(result.pricingSnapshot.outputCnyPerMillion, 13.5);\n  assert.equal(result.costSnapshot.inputHitCny, 0.15);\n  assert.equal(result.costSnapshot.inputMissCny, 4.5);\n  assert.equal(result.costSnapshot.outputCny, 13.5);\n  assert.equal(result.costSnapshot.totalCny, 18.15);\n});\n\ntest('DeepSeek Flash uses official CNY rates directly instead of USD FX conversion', () => {\n  const timestamp = Date.parse('2026-10-09T01:30:00Z'); // 09:30 Beijing, peak.\n  const result = estimateCacheCost('deepseek-flash', usage({ hit: 1_000_000, miss: 1_000_000, output: 1_000_000 }), timestamp);\n  assert.equal(result.pricingSnapshot.inputHitCnyPerMillion, 0.04);\n  assert.equal(result.pricingSnapshot.inputMissCnyPerMillion, 2);\n  assert.equal(result.pricingSnapshot.outputCnyPerMillion, 8);\n  assert.equal(result.costSnapshot.totalCny, 10.04);\n});\n\ntest('DeepSeek Chinese public holidays are off-peak even on weekdays', () => {`,
          );

          console.log('v4.08 patch complete.');
          NODE

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install, test and build
        run: |
          pnpm install
          node --test src/世界书管理器/cache-inspector/pricing.test.cjs
          pnpm build
          rm -rf dist/角色卡示例 dist/脚本示例 dist/流式楼层界面示例 dist/前端界面示例

      - name: Commit source and bundle
        uses: EndBug/add-and-commit@v9.1.3
        with:
          default_author: github_actions
          message: 'fix: 官方人民币计价与版本源 v4.08'
